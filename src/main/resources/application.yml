spring:
  application:
    name: covercompare
  datasource:
    # No defaults for credentials: the app refuses to start rather than fall back to a guessable password.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

covercompare:
  quote:
    validity: 30d
  pricing:
    insurance-premium-tax-rate: 0.12
    insurers:
      - code: PENNINE
        name: Pennine Mutual
        rate-multiplier: 0.95
        min-driver-age: 25
        max-vehicle-group: 50
      - code: LIGHTHOUSE
        name: Lighthouse Direct
        rate-multiplier: 1.00
        min-driver-age: 17
        max-vehicle-group: 40
      - code: REDBRICK
        name: Redbrick Insurance
        rate-multiplier: 1.12
        min-driver-age: 17
        max-vehicle-group: 50
