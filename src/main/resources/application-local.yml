# Run without Docker: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Data lives in memory and is lost on restart. Not for production use.
spring:
  datasource:
    url: jdbc:h2:mem:covercompare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  h2:
    console:
      enabled: true
