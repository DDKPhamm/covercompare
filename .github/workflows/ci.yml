name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default; jobs ask for more only if they need it.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is now out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Every module: unit tests, integration tests (PostgreSQL in Docker), then the coverage gate.
      - name: Build, test and check coverage
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
            */target/site/jacoco/
          retention-days: 14

  end-to-end:
    name: End-to-end (Docker Compose)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # A fresh random password per run: nothing secret is stored in the repository or the workflow.
      - name: Generate database password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "DB_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build images and start the stack
        run: docker compose up --build --wait --wait-timeout 300

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
