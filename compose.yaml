# Local PostgreSQL for running the app with the default profile. Development only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: covercompare
      POSTGRES_USER: covercompare
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before running docker compose}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
