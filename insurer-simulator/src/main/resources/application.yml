server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: insurer-simulator
  threads:
    # Simulated latency is a sleeping thread; virtual threads make sleeping requests almost free.
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Faults default to none. Turn them on per insurer, for example with the environment variable
# SIMULATOR_INSURERS_LIGHTHOUSE_FAULTS_FAILURERATE=0.3
simulator:
  insurance-premium-tax-rate: 0.12
  insurers:
    pennine:
      name: Pennine Mutual
      rate-multiplier: 0.95
      min-driver-age: 25
      max-vehicle-group: 50
    lighthouse:
      name: Lighthouse Direct
      rate-multiplier: 1.00
      min-driver-age: 17
      max-vehicle-group: 40
    redbrick:
      name: Redbrick Insurance
      rate-multiplier: 1.12
      min-driver-age: 17
      max-vehicle-group: 45
